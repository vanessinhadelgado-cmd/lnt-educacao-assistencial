<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LNT · Educação Assistencial</title>
<style>
:root{
--brand:#A33F00; /* ÚNICA LINHA PARA TROCAR A COR DA MARCA */
--pri:var(--brand);--onp:#fff;
--pc:color-mix(in oklab,var(--brand) 14%,#fff);--opc:color-mix(in oklab,var(--brand) 55%,#000);
--bg:color-mix(in oklab,var(--brand) 3%,#fff);--surf:color-mix(in oklab,var(--brand) 7%,#fff);--surf2:color-mix(in oklab,var(--brand) 13%,#fff);
--on:#1D1B1A;--mut:#5C5552;--ln:#DDD3CE;--err:#B3261E;--ok:#1B6B3A;
--sh:0 1px 2px rgb(0 0 0/.06);color-scheme:light}
@media(prefers-color-scheme:dark){:root{
--pri:color-mix(in oklab,var(--brand) 45%,#fff);--onp:color-mix(in oklab,var(--brand) 30%,#000);
--pc:color-mix(in oklab,var(--brand) 40%,#000);--opc:color-mix(in oklab,var(--brand) 20%,#fff);
--bg:color-mix(in oklab,var(--brand) 5%,#131110);--surf:color-mix(in oklab,var(--brand) 9%,#1C1917);--surf2:color-mix(in oklab,var(--brand) 16%,#1C1917);
--on:#EDE6E2;--mut:#BDB2AC;--ln:#463E3A;--err:#FFB4AB;--ok:#8FD8A3;--sh:none;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--on);font:16px/1.5 -apple-system,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) 24px 12px;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:.8125rem;font-weight:500;letter-spacing:.02em;color:var(--mut)}
main{max-width:560px;margin:0 auto;padding:8px 16px calc(48px + env(safe-area-inset-bottom))}
main.w{max-width:960px}
main:not(.w) section{background:var(--surf);border-radius:20px;padding:8px 20px 24px;box-shadow:var(--sh)}
h2{font-size:1.5rem;line-height:1.25;font-weight:600;letter-spacing:-.01em;margin:16px 0 4px}
h3{font-size:1rem;font-weight:600;margin:32px 0 4px}
.mut{color:var(--mut);font-size:.875rem;margin:0 0 8px}
label{display:block;font-size:.8125rem;font-weight:500;color:var(--mut);margin:20px 0 6px}
input,textarea,select{width:100%;min-height:52px;padding:12px 16px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--on);font:inherit;transition:border-color .15s,box-shadow .15s}
textarea{min-height:96px;resize:vertical}
::placeholder{color:var(--mut);opacity:.7}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in oklab,var(--pri) 25%,transparent)}
.btn{min-height:52px;padding:0 24px;border:0;border-radius:26px;background:var(--pri);color:var(--onp);font:600 1rem inherit;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.alt{background:var(--pc);color:var(--opc);border:0}
.btn:disabled{opacity:.5}
.row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:48px;padding:0 16px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--on);font:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.seg .on{background:var(--pc);border-color:var(--pri);color:var(--opc);font-weight:600}
.seg .on::before{content:"✓ "}
.prog{height:6px;background:var(--surf2);border-radius:3px;margin:8px 0 12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .25s}
.note{background:var(--pc);color:var(--opc);padding:12px 16px;border-radius:14px;font-size:.875rem;font-weight:500;margin:12px 0 0}
.hint{font-size:.8125rem;color:var(--mut);margin-top:8px}
.msg{color:var(--err);font-size:.875rem;margin:16px 0 0}
.msg:not(:empty){background:color-mix(in oklab,var(--err) 10%,transparent);padding:12px 16px;border-radius:12px}
.card{background:var(--surf);border-radius:16px;padding:4px 16px;margin:12px 0;box-shadow:var(--sh)}
summary{cursor:pointer;min-height:56px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
dt{font-size:.8125rem;font-weight:500;color:var(--mut);margin-top:16px}
dd{margin:2px 0 12px;white-space:pre-wrap}
.ok{width:72px;height:72px;border-radius:50%;background:color-mix(in oklab,var(--ok) 14%,var(--bg));color:var(--ok);display:grid;place-items:center;font-size:32px;margin:40px auto 16px}
.c{text-align:center;padding-bottom:16px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>Educação Assistencial · Levantamento de necessidades de treinamento</header>
<main id="m"></main>
<script>
const U="https://qfvbfwqfxvzgmqzladzb.supabase.co",K="sb_publishable_nnc4pqRMIKN0rFsrsVpqDA_rzFKPetr";
const $=id=>document.getElementById(id),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hd=t=>({apikey:K,"Content-Type":"application/json",...(t?{Authorization:"Bearer "+t}:{})});
const msg=t=>{$("nt").textContent=t||""};
const F={
codigo:["Código de acesso","i","Informado pela Educação",1],
hospital:["Hospital / unidade","i","Ex.: Hospital X",1],
area:["Área solicitante","i","Ex.: UTI adulto",1],
solicitante:["Seu nome","i","",0],
acontecendo:["O que está acontecendo? (necessidade de treinamento)","t","Ex.: aumento do número de quedas",1],
publico:["Para quem é a solução?","t","Perfil, local, formação",0],
diferente:["O que eles precisam fazer diferente e melhor?","t","Comportamentos e atitudes",0],
resultados:["Que resultados esse treinamento vai trazer ao negócio?","t","Indicadores, custos, segurança do paciente",0],
medir:["Como saberemos se o público está atuando melhor?","t","Pessoas e/ou indicadores",0],
conteudista:["Quem conhece bem esse assunto e pode ajudar com o conteúdo?","t","Nome e área, se souber",0],
fatores:["Fatores críticos de sucesso","t","Ex.: adesão ao protocolo",0],
sucesso:["Essa experiência será um sucesso se…","t","Ex.: liderança acompanhar, melhora nos indicadores",0],
justificativa:["Por que isso não pode esperar?","t","Ex.: risco ao paciente, auditoria, indicador fora da meta",0]};
const ST=[
{t:"Onde é o problema?",h:"Esta ferramenta reúne as necessidades de treinamento das áreas assistenciais. Em cerca de 3 minutos, conte o que está acontecendo e o que precisa melhorar: com as suas respostas, a Educação Assistencial planeja o cronograma de treinamentos de 2027. Os prazos são combinados com a equipe, de acordo com a capacidade disponível.",n:"Não inclua nomes nem dados de pacientes.",k:["codigo","hospital","area","solicitante"]},
{t:"O que está acontecendo?",k:["acontecendo","publico"]},
{t:"O que precisa mudar?",h:"Pode pular se não souber agora.",k:["diferente","resultados"]},
{t:"Qual a urgência?",k:[],seg:1,more:["medir","conteudista","fatores","sucesso"]}];
const OPS={criticidade:["Alta","Média","Baixa"],prazo:["Até 30 dias","Até 90 dias","Até 180 dias","Sem prazo definido"],formato:["Presencial","EAD","Blended"]};
const LB={criticidade:"Criticidade",prazo:"Para quando você precisa?",formato:"Formato preferido"};

function form(){
 let V={criticidade:"",prazo:"Sem prazo definido",formato:""},cur=0;
 const fld=k=>{const[l,t,p,r]=F[k];return `<label for="${k}">${esc(l)}${r?" *":""}</label>`+(t==="t"?`<textarea id="${k}" placeholder="${esc(p)}"></textarea>`:`<input id="${k}" placeholder="${esc(p)}" autocomplete="off">`)};
 const seg=k=>`<label>${LB[k]}${k==="criticidade"?" *":""}</label><div class="seg" data-k="${k}">${OPS[k].map(o=>`<button type="button" data-v="${o}">${o}</button>`).join("")}</div>`;
 $("m").className="";
 $("m").innerHTML=`<div class="prog"><i id="pg"></i></div><p class="mut" id="sp"></p>`+ST.map((s,i)=>`<section id="s${i}" hidden><h2>${s.t}</h2>${s.h?`<p class="mut">${s.h}</p>`:""}${s.n?`<p class="note">${s.n}</p>`:""}${s.k.map(fld).join("")}${s.seg?seg("criticidade")+`<div class="hint"><b>Alta:</b> risco direto ao paciente ou à segurança, exigência regulatória ou de auditoria, ou indicador crítico fora da meta.<br><b>Média:</b> impacto relevante na assistência, sem risco imediato.<br><b>Baixa:</b> melhoria ou desenvolvimento, sem prazo crítico.</div>`+seg("prazo")+`<div id="jw" hidden>${fld("justificativa")}</div>`+seg("formato")+`<h3>Quer detalhar mais? (opcional)</h3><p class="mut">Se você já souber, ajuda a Educação a planejar melhor.</p>${s.more.map(fld).join("")}`:""}</section>`).join("")+`<p class="msg" id="nt" role="alert"></p><div class="row" id="nv"><button class="btn alt" id="bk" type="button">Voltar</button><button class="btn" id="nx" type="button">Continuar</button></div><div id="dn" hidden></div>`;
 const paint=()=>document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",V[b.parentNode.dataset.k]===b.dataset.v));
 const go=n=>{cur=n;ST.forEach((_,i)=>$("s"+i).hidden=i!==n);$("pg").style.width=(n+1)*25+"%";$("sp").textContent="Etapa "+(n+1)+" de 4";$("bk").hidden=n===0;$("nx").textContent=n===3?"Enviar necessidade":"Continuar";msg("");window.scrollTo(0,0)};
 $("m").addEventListener("click",e=>{const b=e.target.closest(".seg button");if(b){V[b.parentNode.dataset.k]=b.dataset.v;paint();jw()}});
 $("bk").onclick=()=>go(cur-1);
 $("nx").onclick=()=>{
  const miss=ST[cur].k.find(k=>F[k][3]&&!$(k).value.trim());
  if(miss){msg("Preencha: "+F[miss][0].replace(/ \(.*\)/,"")+".");$(miss).focus();return}
  if(cur<3){go(cur+1);return}
  if(!V.criticidade){msg("Escolha a criticidade.");return}
  if(!$("jw").hidden&&!$("justificativa").value.trim()){msg("Explique por que isso não pode esperar.");$("justificativa").focus();return}
  send()};
 async function send(){
  const p={};Object.keys(F).forEach(k=>p[k]=$(k).value.trim());Object.assign(p,V);if($("jw").hidden)p.justificativa="";
  const cod=p.codigo;delete p.codigo;
  $("nx").disabled=true;
  try{
   const r=await fetch(U+"/rest/v1/rpc/enviar_necessidade",{method:"POST",headers:hd(),body:JSON.stringify({p_codigo:cod,p})});
   if(r.ok)return done(p);
   const j=await r.json().catch(()=>({}));
   if(/codigo_invalido/.test(JSON.stringify(j))){hc(false);$("codigo").value="";go(0);msg("Código de acesso incorreto. Confira com a Educação Assistencial.")}
   else msg("Não foi possível enviar agora. Tente de novo em instantes.");
  }catch(e){msg("Sem conexão. Confira a internet e tente de novo.")}
  $("nx").disabled=false}
 function done(p){
  ST.forEach((_,i)=>$("s"+i).hidden=true);$("nv").hidden=true;$("pg").style.width="100%";$("sp").textContent="";
  $("dn").hidden=false;
  $("dn").innerHTML=`<div class="ok" aria-hidden="true">✓</div><div class="c"><h2>Recebemos sua necessidade</h2><p>${esc(p.area)} · ${esc(p.acontecendo)}</p><p class="mut">Criticidade ${esc(p.criticidade.toLowerCase())} · ${esc(p.prazo.toLowerCase())}<br>A Educação Assistencial vai analisar e retornar com o mês no cronograma.</p><button class="btn" id="again">Registrar outra</button></div>`;
  $("again").onclick=form}
 const jw=()=>{$("jw").hidden=!(V.criticidade==="Alta"||V.prazo==="Até 30 dias")};
 const hc=v=>{$("codigo").hidden=v;$("codigo").previousElementSibling.hidden=v};
 const c0=new URLSearchParams(location.search).get("c");
 if(c0){$("codigo").value=c0.trim();hc(true)}
 paint();go(0)}

let rows=[],T=null,fa="",fc="";
const SC=d=>({Alta:3,"Média":2,Baixa:1}[d.criticidade]||0)*2+({"Até 30 dias":3,"Até 90 dias":2,"Até 180 dias":1}[d.prazo]||0);
const DK=["solicitante","acontecendo","justificativa","publico","diferente","resultados","medir","conteudista","fatores","sucesso","formato"];
function panel(){
 $("m").className="w";
 $("m").innerHTML=`<h2>Painel da Educação</h2><p class="mut">Acesso restrito.</p><form id="lg"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password"><p class="msg" id="nt" role="alert"></p><button class="btn">Entrar</button></form>`;
 $("lg").onsubmit=async e=>{e.preventDefault();msg("");
  try{
   const r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:hd(),body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})});
   const j=await r.json().catch(()=>({}));
   if(!r.ok||!j.access_token){msg("E-mail ou senha incorretos.");return}
   T=j.access_token;
   const q=await fetch(U+"/rest/v1/necessidades?select=*&order=criado_em.desc&limit=1000",{headers:hd(T)});
   if(!q.ok){msg("Não foi possível carregar as respostas.");return}
   rows=await q.json();draw();
  }catch(x){msg("Sem conexão. Tente de novo.")}}}
function draw(){
 const areas=[...new Set(rows.map(r=>r.area))].sort();
 const L=rows.filter(r=>(!fa||r.area===fa)&&(!fc||r.criticidade===fc)).sort((a,b)=>SC(b)-SC(a)||String(b.criado_em).localeCompare(String(a.criado_em)));
 $("m").innerHTML=`<h2>Pedidos (${L.length})</h2><div class="row"><select id="fa" aria-label="Filtrar por área"><option value="">Todas as áreas</option>${areas.map(a=>`<option${a===fa?" selected":""}>${esc(a)}</option>`).join("")}</select><select id="fc" aria-label="Filtrar por criticidade"><option value="">Toda criticidade</option>${OPS.criticidade.map(c=>`<option${c===fc?" selected":""}>${c}</option>`).join("")}</select><button class="btn" id="ex" type="button">Exportar CSV</button></div>`+
 (L.length?L.map(r=>`<details class="card"><summary><b>${esc(r.area)}</b> ${esc(r.hospital)} · ${esc(r.criticidade)} · ${esc(r.prazo)} · ${new Date(r.criado_em).toLocaleDateString("pt-BR")}</summary><dl>${DK.filter(k=>r[k]).map(k=>`<dt>${esc(F[k]?F[k][0]:"Formato")}</dt><dd>${esc(r[k])}</dd>`).join("")}</dl></details>`).join(""):`<p class="mut">Nenhuma resposta ainda. Envie o link e o código de acesso aos especialistas.</p>`);
 $("fa").onchange=e=>{fa=e.target.value;draw()};
 $("fc").onchange=e=>{fc=e.target.value;draw()};
 $("ex").onclick=()=>csv(L)}
function csv(L){
 const C=["criado_em","hospital","area","solicitante","criticidade","prazo","justificativa","formato","acontecendo","publico","diferente","resultados","medir","conteudista","fatores","sucesso","status"];
 const q=v=>{let s=String(v==null?"":v);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
 const t="\ufeff"+[C.map(q),...L.map(r=>C.map(c=>q(c==="criado_em"?new Date(r[c]).toLocaleDateString("pt-BR"):r[c])))].map(l=>l.join(";")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download="LNT_respostas.csv";a.click()}
const route=()=>location.hash==="#painel"?panel():form();
window.onhashchange=route;route();
</script>
</body>
</html>
